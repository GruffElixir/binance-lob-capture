name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  # Exactly the prerequisites listed in the README (Ubuntu 22.04): the brief's list plus
  # ca-certificates, which TLS verification needs and minimal images lack. git is only needed by
  # the CI container itself (checkout).
  README_APT_PACKAGES: cmake ninja-build g++-12 libssl-dev libboost-all-dev zlib1g-dev ca-certificates
  CI_APT_PACKAGES: git

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Pin the OS image the reviewers use instead of relying on a runner image that may retire.
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-12 / Release
            cxx: g++-12
            extra_packages: ""
          - name: clang-15 / Release
            cxx: clang++-15
            extra_packages: clang-15
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES ${{ matrix.extra_packages }}

      - uses: actions/checkout@v5

      - name: Configure (README command, warnings as errors)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -O2"
          -DBLC_WARNINGS_AS_ERRORS=ON

      - name: Build (log must be warning-free, third-party code included)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2>&1 | tee build.log
          if grep -n "warning:" build.log; then
            echo "::error::the build log contains compiler warnings"
            exit 1
          fi

      - name: Unit tests (README command, as a non-root user so permission tests run)
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target tests
          useradd -m tester
          chmod -R a+rX build
          su tester -c "./build/tests/unit_tests"

      - name: Smoke
        run: ./build/binance_capture --version

  reviewer-clean-build:
    name: Reviewer checklist / build from clean
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install README prerequisites only
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES

      - uses: actions/checkout@v5

      - name: cmake -B build && cmake --build build
        run: cmake -B build && cmake --build build

      - name: Binary is at ./build/binance_capture
        run: ./build/binance_capture --version

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install git and clang-format-15
        run: |
          apt-get update
          apt-get install -y git clang-format-15

      - uses: actions/checkout@v5

      - name: Check formatting (vendored code excluded)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          clang-format-15 --dry-run --Werror $(git ls-files '*.cpp' '*.hpp' '*.hpp.in' ':!:third_party/**')

  asan-ubsan:
    name: ASan + UBSan (Debug)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      # LeakSanitizer needs ptrace; seccomp=unconfined permits the setarch -R fallback.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      CXX: g++-12
      BLC_TEST_TIME_SCALE: "10"
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES util-linux

      - uses: actions/checkout@v5

      - name: Configure and build
        run: |
          cmake --preset asan
          cmake --build build/asan --target unit_tests

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Runner kernels with high vm.mmap_rnd_bits can make older sanitizer runtimes abort
          # with "unexpected memory mapping"; disabling ASLR for the test process avoids it.
          setarch "$(uname -m)" -R ./build/asan/tests/unit_tests

  tsan:
    name: TSan (RelWithDebInfo)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      CXX: g++-12
      BLC_TEST_TIME_SCALE: "10"
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES util-linux

      - uses: actions/checkout@v5

      - name: Configure and build
        run: |
          cmake --preset tsan
          cmake --build build/tsan --target unit_tests

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          # See the asan-ubsan job: disabling ASLR avoids "unexpected memory mapping" aborts.
          setarch "$(uname -m)" -R ./build/tsan/tests/unit_tests

  output-contract:
    name: Output contract (scenario replays, blc_verify, no network in replay)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --cap-add=SYS_PTRACE
    env:
      CXX: g++-12
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES strace

      - uses: actions/checkout@v5

      - name: Build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target binance_capture blc_verify

      - name: Replay every scenario through the market_data_*.csv glob
        shell: bash
        run: |
          set -euo pipefail
          for dir in tests/scenarios/*/; do
            name="$(basename "$dir")"
            ./build/binance_capture --replay "$dir"input/market_data_*.csv --output-dir "replay_output/$name"
            diff -r "replay_output/$name" "${dir}expected"
          done

      - name: Verify inputs and outputs (headers, 26 columns, blc_verify)
        shell: bash
        run: |
          set -euo pipefail
          for dir in tests/scenarios/*/; do
            name="$(basename "$dir")"
            scripts/verify_outputs.sh "replay_output/$name"/*.csv "$dir"input/*.csv
          done

      - name: The no-socket assertion itself works
        shell: bash
        run: |
          set -euo pipefail
          printf 'socket(AF_INET, SOCK_STREAM, IPPROTO_TCP) = 3\n' > synthetic_socket.log
          : > synthetic_empty.log
          if scripts/check_no_socket.sh synthetic_socket.log; then
            echo "::error::a trace containing socket( was accepted"
            exit 1
          fi
          scripts/check_no_socket.sh synthetic_empty.log

      - name: Replay makes no network calls (strace)
        shell: bash
        run: |
          set -euo pipefail
          dir=tests/scenarios/two_symbols_one_shard_reconnect
          strace -f -e trace=socket -o strace.log \
            ./build/binance_capture --replay "$dir"/input/market_data_*.csv --output-dir strace_output
          scripts/check_no_socket.sh strace.log

      - name: Credential-like text only where documented
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/check_secrets.sh

  valgrind:
    name: Valgrind (scenario replays)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      CXX: g++-12
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y $README_APT_PACKAGES $CI_APT_PACKAGES valgrind

      - uses: actions/checkout@v5

      - name: Build (RelWithDebInfo)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --target binance_capture

      - name: Replay every scenario under Valgrind
        shell: bash
        run: |
          set -euo pipefail
          for dir in tests/scenarios/*/; do
            name="$(basename "$dir")"
            valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite,indirect \
              ./build/binance_capture --replay "$dir"input/market_data_*.csv --output-dir "vg_output/$name"
            diff -r "vg_output/$name" "${dir}expected"
          done
